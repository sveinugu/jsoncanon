[project]
name = "jsoncanon"
dynamic = ["version"]
description = "Typed Python implementation of JSON Canonicalization Scheme as described in RFC 8785. Currently lacks full floating point support"
license = "Apache-2.0"
readme = "README.md"
keywords = [
    "JSON",
    "RFC-8785",
    "canonicalization",
    "deterministic",
    "serialization",
    "hash",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10,<4.0"
dependencies = ["simplejson>=4.1.2"]

[[project.authors]]
name = "Sveinung Gundersen"
email = "sveinugu@gmail.com"

[project.urls]
repository = "https://github.com/sveinugu/jsoncanon"
releases = "https://github.com/sveinugu/jsoncanon/releases"

[dependency-groups]
dev = [
    "pytest>=9.1.0,<10",
    "pytest-pycharm>=0.7.0,<0.8",
    "ruff>=0.16.0,<0.17",
    "prek>=0.2.0,<1",
    "basedpyright>=1.40.1",
    "mypy>=2.3.0,<3",
    "hypothesis>=6.168.0",
    "rfc8785>=0.1.4",
    "jcs>=0.2.1",
    "tombi>=1.9.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/jsoncanon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/json-canonicalization"]
force-exclude = true
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "Q", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.isort]
force-single-line = false

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/json-canonicalization"]
typeCheckingMode = "strict"

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["tests/json-canonicalization"]
