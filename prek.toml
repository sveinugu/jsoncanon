# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = "^tests/json-canonicalization/"

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"

[[repos.hooks]]
id = "trailing-whitespace"
groups = ["watch", "commit"]

[[repos.hooks]]
id = "end-of-file-fixer"
groups = ["watch", "commit"]

[[repos.hooks]]
id = "check-toml"
groups = ["commit"]

[[repos.hooks]]
id = "check-yaml"
groups = ["commit"]

[[repos.hooks]]
id = "check-merge-conflict"
groups = ["commit"]

[[repos]]
repo = "local"

# Ruff is run through uv to use the version from the dev dependencies in pyproject.toml, so that
# the hooks, CI and manual runs always agree on formatting and rules (a separately pinned
# ruff-pre-commit rev can drift out of step). File excludes are set in pyproject.toml.
[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
types = ["python"]
groups = ["watch", "commit"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
types_or = ["python", "markdown"]
groups = ["watch", "commit"]

[[repos.hooks]]
id = "basedpyright"
name = "basedpyright"
entry = "uv run basedpyright"
language = "system"
types = ["python"]
pass_filenames = false
groups = ["commit"]

[[repos.hooks]]
id = "mypy"
name = "mypy"
entry = "uv run mypy"
language = "system"
types = ["python"]
pass_filenames = false
groups = ["commit"]

[[repos.hooks]]
id = "tombi"
name = "tombi format"
entry = "uv run tombi format"
language = "system"
types = ["toml"]
groups = ["watch", "commit"]
