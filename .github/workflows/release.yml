name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to upload to PyPI (for example, v0.2.4)
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jsoncanon/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = false
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.tar.gz' --pattern '*.whl'
      - name: Check release assets
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = 1
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Lets a rerun finish a partial upload
          skip-existing: true
