name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The package version is derived from the release tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync
      - run: uv run prek run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          # The package version is derived from the release tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --python ${{ matrix.python-version }}
      - run: uv run pytest
